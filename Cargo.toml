[package]
name = "VG_Switcher"
version = "0.5.0"
edition = "2024"
license = "MIT"

# The app lives in a library so its logic can be unit-tested without
# launching the GUI binary (which embeds a requireAdministrator manifest and
# so can't be started from a non-elevated `cargo test`).
[lib]
name = "vg_switcher"
path = "src/lib.rs"

[[bin]]
name = "VG_Switcher"
path = "src/main.rs"
test = false

[dependencies]
log = { version = "0.4", features = ["std"] }
native-windows-gui = "1.0.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
tray-icon = "0.26.1"
# native-windows-gui is built on winapi 0.3, so we use the same bindings
# rather than adding a second Win32 binding crate.
winapi = { version = "0.3.9", features = [
    "accctrl",
    "aclapi",
    "combaseapi",
    "commctrl",
    "dwmapi",
    "errhandlingapi",
    "handleapi",
    "knownfolders",
    "libloaderapi",
    "minwinbase",
    "processthreadsapi",
    "sddl",
    "securitybaseapi",
    "shlobj",
    "synchapi",
    "sysinfoapi",
    "tlhelp32",
    "uxtheme",
    "winbase",
    "winerror",
    "wingdi",
    "winnt",
    "winreg",
    "winsvc",
    "winuser",
] }

[build-dependencies]
embed-manifest = "1.5.1"
winresource = "0.1.34"

[profile.release]
lto = true
codegen-units = 1
strip = true
# A panic hook (src/logging.rs) logs the panic and shows a message box first.
panic = "abort"
